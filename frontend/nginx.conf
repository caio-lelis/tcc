server {
    listen 80;
    root /usr/share/nginx/html;

    # upload de CSV (o backend aceita até 50 MB)
    client_max_body_size 50m;

    # /api/... -> backend (o prefixo /api é removido)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;  # duas chamadas ao modelo + consulta
    }

    # aplicação de página única
    location / {
        try_files $uri /index.html;
    }
}
