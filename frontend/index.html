<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Talk</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Aplica o tema antes do primeiro desenho, para a tela não piscar (ver src/tema.js).
      (function () {
        var escolha = null;
        try { escolha = localStorage.getItem("data-talk:tema"); } catch (e) {}
        document.documentElement.dataset.tema =
          escolha || (matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro");
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
